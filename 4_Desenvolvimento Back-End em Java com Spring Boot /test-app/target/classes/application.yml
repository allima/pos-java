server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - com.google.cloud.spring.autoconfigure.storage.GcpStorageAutoConfiguration
  application:
    name: payment-microservice
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    gcp:
      pubsub:
        emulator-host: localhost:8085
        project-id: payment-test
      storage:
        emulator:
          enabled: true
          host: localhost:8085
        project-id: payment-test
        bucket: comprovantes

gcp:
  pubsub:
    topics:
      payment-created: payment-created-topic
    subscriptions:
      payment-processor: payment-processor-subscription

security:
  jwt:
    secret: mySecretKeyForJWTTokenGenerationMustBeLongEnough12345678901234567890
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.app: DEBUG
    org.springframework.security: DEBUG
